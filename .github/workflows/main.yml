name: Build & Test Library
on: [ push ]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        operating-system: [ ubuntu-latest ]
        php-versions: [ '8.1' ]
    name: PHP ${{ matrix.php-versions }} Test on ${{ matrix.operating-system }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          tools: composer,phpstan
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install PHP Dependencies
        run: composer install --optimize-autoloader --prefer-dist
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{secrets.COMPOSER_GITHUB_ACTIONS }}"} }'
          SYMFONY_ENV: test

      - name: Highcharts install
        run: npm install highcharts-export-server@3.1.1 -g
        env:
          ACCEPT_HIGHCHARTS_LICENSE: 1

      - name: Set Highcharts Export Server CDN with Fallback
        run: |
          echo "HIGHCHARTS_CACHE_PATH=/home/gitrunner/cache-highcharts" >> $GITHUB_ENV
          echo "HIGHCHARTS_CDN=https://cdn.jsdelivr.net/npm/highcharts@11.4.6/" >> $GITHUB_ENV
          echo "HIGHCHARTS_RESOURCES={\"files\": [\"https://code.highcharts.com/stock/indicators/indicators-all.js\", \"https://code.highcharts.com/maps/modules/map.js\", \"https://code.highcharts.com/modules/pictorial.js\"]}" >> $GITHUB_ENV

      - name: Unit Tests
        run: vendor/bin/phpunit

      - name: Static Analysis (phpstan)
        run: phpstan analyse --memory-limit=-1 --no-progress
