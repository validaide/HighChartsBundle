name: Build & Test Library
on: [ push ]
jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        operating-system: [ ubuntu-22.04 ]
        php-versions: [ '8.4' ]
    name: PHP ${{ matrix.php-versions }} Test on ${{ matrix.operating-system }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          tools: composer,phpstan
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install PHP Dependencies
        run: composer install --optimize-autoloader --prefer-dist
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{secrets.COMPOSER_GITHUB_ACTIONS }}"} }'
          SYMFONY_ENV: test

      - name: Create .npm-global bin directory
        run: mkdir -p ~/.npm-global/bin

      - name: Setup npm global path
        run: |
          npm config set prefix ~/.npm-global
          echo "$HOME/.npm-global/bin" >> $GITHUB_PATH

      # The version the app installs; its Puppeteer downloads the Chrome it needs
      - name: Install highcharts-export-server
        run: npm install -g highcharts-export-server@5.1.0

      - name: Unit Tests
        run: vendor/bin/phpunit
        env:
          SYMFONY_DEPRECATIONS_HELPER: disabled
          # Highcharts from the export server's own npm package, like in the app, instead of the CDN
          HIGHCHARTS_USE_NPM: 'true'

      - name: Static Analysis (phpstan)
        run: phpstan analyse --memory-limit=-1 --no-progress
