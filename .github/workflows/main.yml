name: Build & Test Library
on: [ push ]
jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        operating-system: [ ubuntu-22.04 ]
        php-versions: [ '8.1' ]
    name: PHP ${{ matrix.php-versions }} Test on ${{ matrix.operating-system }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          tools: composer,phpstan
        env:
          COMPOSER_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install PHP Dependencies
        run: composer install --optimize-autoloader --prefer-dist
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{secrets.COMPOSER_GITHUB_ACTIONS }}"} }'
          SYMFONY_ENV: test

#      - name: Install system dependencies for Puppeteer/Chromium
#        run: |
#          sudo apt-get update
#          sudo apt-get install -y \
#            libx11-xcb1 \
#            libxcomposite1 \
#            libasound2 \
#            libatk1.0-0 \
#            libatk-bridge2.0-0 \
#            libcairo2 \
#            libcups2 \
#            libdbus-1-3 \
#            libexpat1 \
#            libfontconfig1 \
#            libgbm1 \
#            libgcc1 \
#            libglib2.0-0 \
#            libgtk-3-0 \
#            libnspr4 \
#            libpango-1.0-0 \
#            libpangocairo-1.0-0 \
#            libstdc++6 \
#            libx11-6 \
#            libxcb1 \
#            libxcursor1 \
#            libxdamage1 \
#            libxext6 \
#            libxfixes3 \
#            libxi6 \
#            libxrandr2 \
#            libxrender1 \
#            libxss1 \
#            libxtst6

      - name: Create .npm-global bin directory
        run: mkdir -p ~/.npm-global/bin

      - name: Setup npm global path
        run: |
          npm config set prefix ~/.npm-global
          echo "$HOME/.npm-global/bin" >> $GITHUB_PATH

      - name: Extract highcharts-export-server
        run: |
          mkdir -p ~/.npm-global/lib/node_modules/highcharts-export-server
          tar -xzf "${{ github.workspace }}/.github/workflows/highcharts-export-server.tar.gz" -C ~/.npm-global/lib/node_modules/highcharts-export-server
          ln -s ~/.npm-global/lib/node_modules/highcharts-export-server/bin/cli.js ~/.npm-global/bin/highcharts-export-server

      - name: Create symlink
        run: |
          chmod +x ~/.npm-global/lib/node_modules/highcharts-export-server/cli.js
          ln -sf ~/.npm-global/lib/node_modules/highcharts-export-server/cli.js ~/.npm-global/bin/highcharts-export-server

      - name: Check highcharts-export-server
        run: which highcharts-export-server && highcharts-export-server --help

      - name: Puppeteer install
        run: npm install puppeteer -g

      - name: Puppeteer configuration
        run: puppeteer browsers install chrome@121.0.6167.85

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

#      - name: Install highcharts-export-server without downloading Chromium
#        run: npm install -g highcharts-export-server@3.1.1

      - name: Unit Tests
        run: vendor/bin/phpunit

      - name: Static Analysis (phpstan)
        run: phpstan analyse --memory-limit=-1 --no-progress
